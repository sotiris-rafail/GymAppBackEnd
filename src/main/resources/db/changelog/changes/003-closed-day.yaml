# Dates on which the gym is closed. Sundays are closed by rule and are not stored here.
databaseChangeLog:

  - changeSet:
      id: closed-day-001
      author: foundry
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: closed_day
      changes:
        - createTable:
            tableName: closed_day
            remarks: A date with no classes
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_closed_day } }
              - column: { name: day, type: DATE, constraints: { nullable: false, unique: true, uniqueConstraintName: uq_closed_day } }
              - column: { name: reason, type: VARCHAR(80) }

  # "day" is a reserved word in H2 and breaks queries, so the column is renamed. Databases created by
  # closed-day-001 are upgraded in place (closed-day-001 itself must never change).
  - changeSet:
      id: closed-day-002-rename-day
      author: foundry
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: closed_day
            columnName: day
      changes:
        - renameColumn:
            tableName: closed_day
            oldColumnName: day
            newColumnName: closed_on
            columnDataType: DATE
