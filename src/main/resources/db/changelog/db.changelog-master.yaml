# Entry point. Add new files at the END of this list and never edit a changeset that has been released:
# Liquibase stores a checksum of every applied changeset and refuses to start if one changes.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-initial-schema.yaml
  - include:
      file: db/changelog/changes/002-promo.yaml
  - include:
      file: db/changelog/changes/003-closed-day.yaml
  - include:
      file: db/changelog/changes/004-preferences.yaml
  - include:
      file: db/changelog/changes/005-app-setting.yaml
